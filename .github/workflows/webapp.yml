name: Webapp

on:
  pull_request:
    paths:
      - "tools/webapp/**"
      - ".github/workflows/webapp.yml"
  push:
    branches:
      - main
    paths:
      - "tools/webapp/**"
      - ".github/workflows/webapp.yml"

concurrency:
  group: webapp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build SPA
        run: npm run build
