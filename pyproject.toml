[project]
name = "waffle-voice"
version = "0.1.0"
description = "Voice-to-voice AI assistant"
requires-python = ">=3.11,<3.12"

dependencies = [
    "aiofiles>=23.0",
    "aiortc>=1.9.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "kokoro-onnx>=0.5.0",
    "moonshine-voice",
    "numpy>=2.0",
    "onnxruntime>=1.20.0",
    "pocket-tts>=3.3.0",
    "sounddevice",
    "uvicorn>=0.35.0",
]

[tool.uv]
package = false
