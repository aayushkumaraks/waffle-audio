[project]
name = "waffle-voice"
version = "0.1.0"
description = "Voice-to-voice AI assistant"
requires-python = ">=3.11,<3.12"

dependencies = [
    "aiofiles>=23.0",
    "aiortc>=1.9.0",
    "av>=12.0.0",
    "ddgs>=9.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "huggingface-hub>=0.28.0",
    "kokoro-onnx>=0.5.0",
    "mcp>=1.0.0",
    "moonshine-voice>=0.0.68",
    "numpy>=2.0",
    "onnxruntime>=1.20.0",
    "pocket-tts>=3.3.0",
    "pydantic>=2.8.0",
    "rich>=13.0.0",
    "scipy>=1.11.0",
    "silero-vad>=6.2.3",
    "sounddevice>=0.5.0",
    "uvicorn>=0.35.0",
]

[project.optional-dependencies]
resample = [
    "soxr>=1.0.0",
]

[tool.uv]
package = false
